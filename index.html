<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kuda Campus | Student Lost & Found Platform</title>
  <meta name="description" content="Next-generation university lost and found platform inspired by Kuda Bank. Fast, secure, and intuitive campus item recovery." />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN with Kuda Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['SFMono-Regular', 'Menlo', 'monospace']
          },
          colors: {
            kuda: {
              bg: '#0B0914',         // Deep obsidian background
              surface: '#131122',    // Primary card surface
              card: '#19162B',       // Elevated container
              cardHover: '#231F3A',  // Hover container
              border: '#2A2447',     // Subtle hairline borders
              purple: '#6825DF',     // Kuda royal purple
              purpleDark: '#49129C', // Deep brand purple
              purpleLight: '#8B5CF6',// Purple light accent
              lilac: '#D4C5F9',      // Soft pastel banner
              lilacText: '#220D45',  // Dark contrast for banner
              mint: '#00D287',       // Found / Verified green
              mintBg: 'rgba(0, 210, 135, 0.12)',
              coral: '#FF5C5C',      // Lost alert red
              coralBg: 'rgba(255, 92, 92, 0.12)',
              amber: '#FFB800',      // Pending / In-progress
              amberBg: 'rgba(255, 184, 0, 0.12)',
              muted: '#94A3B8',      // Secondary text
              subtle: '#64748B'      // Caption text
            }
          },
          boxShadow: {
            'kuda-glow': '0 0 25px -5px rgba(104, 37, 223, 0.35)',
            'kuda-card': '0 10px 30px -10px rgba(0, 0, 0, 0.5)',
            'kuda-elevated': '0 20px 40px -15px rgba(0, 0, 0, 0.7)'
          }
        }
      }
    };
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0914;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A2447;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6825DF;
    }

    body {
      background-color: #0B0914;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Prevent mobile input zooming */
    input, select, textarea {
      font-size: 16px !important;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-kuda-bg text-white min-h-screen selection:bg-kuda-purple selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
