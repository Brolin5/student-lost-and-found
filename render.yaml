services:
  - type: web
    name: student-lost-and-found
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        value: https://student-lost-and-found.onrender.com
      - key: PLUNGER_INTERVAL_MS
        value: 600000
